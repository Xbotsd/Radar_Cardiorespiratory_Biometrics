name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: tests
        run: pytest -q

  number-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: regenerate docs/NUMBERS.md and require a clean tree
        run: |
          python scripts/07_number_table.py
          git diff --exit-code docs/NUMBERS.md

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install and import
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -c "import rcb, rcb.features, rcb.vitals, rcb.dsp, rcb.io, rcb.stats; print(rcb.__doc__)"
